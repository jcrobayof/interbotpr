<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETU INTER - Chatbot Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        interGreen: '#006747',
                        interGold: '#F3A900',
                        interLight: '#e6f0ec',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for chat */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        .chat-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #006747;
            border-radius: 50%;
            margin-right: 3px;
            animation: typing 1.4s infinite both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Background context to simulate website -->
    <div class="absolute inset-0 z-0 flex flex-col items-center justify-center opacity-20">
        <h1 class="text-6xl font-bold text-interGreen mb-4">SÉ TÚ, EN LA INTER</h1>
        <p class="text-2xl">Simulación del sitio web www.setuinter.com</p>
    </div>

    <!-- Floating Chat Button -->
    <button id="chatToggle" class="fixed bottom-6 right-6 z-50 bg-interGreen hover:bg-green-800 text-white rounded-full w-16 h-16 shadow-2xl flex items-center justify-center transition-transform hover:scale-110">
        <i class="fas fa-comment-dots text-2xl"></i>
    </button>

    <!-- Chat Widget Container -->
    <!-- Se ajustó el ancho (w-[350px]) y la altura máxima (max-h-[500px]) para evitar que se corte -->
    <div id="chatWidget" class="fixed bottom-28 right-6 z-50 w-[350px] max-h-[500px] h-[80vh] bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-all duration-300 transform scale-0 origin-bottom-right">
        
        <!-- Header -->
        <div class="bg-interGreen p-4 text-white flex items-center justify-between shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-interGreen overflow-hidden border-2 border-white">
                    <!-- Se actualizó la URL de la imagen y se ajustaron las clases para que encaje mejor -->
                    <img src="https://www.inter.edu/wp-content/uploads/2021/08/cropped-logo-inter.png" alt="Logo Interamericana" class="w-full h-full object-cover">
                </div>
                <div>
                    <h3 class="font-bold text-lg leading-tight">InterBot 🐯</h3>
                    <p class="text-xs text-interGold flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-400 rounded-full inline-block"></span> En línea 24/7
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="resetChat" class="text-white hover:text-interGold transition-colors" title="Volver al Menú Principal">
                    <i class="fas fa-home text-lg"></i>
                </button>
                <button id="closeChat" class="text-white hover:text-interGold transition-colors" title="Cerrar Chat">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto chat-scroll bg-gray-50 flex flex-col gap-4">
            <!-- Initial Greeting -->
            <div class="flex gap-2">
                <div class="w-8 h-8 rounded-full bg-interGreen flex-shrink-0 flex items-center justify-center text-white text-xs">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bg-white border border-gray-100 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm text-gray-700 max-w-[85%]">
                    ¡Hola! 👋 ¡Qué bueno verte por aquí! Soy el Asesor Virtual de la Universidad Interamericana. <br><br>
                    Cuéntame, ¿en qué te puedo ayudar hoy para que seas tú en La Inter?
                </div>
            </div>

            <!-- Quick Replies (Initial) -->
            <div id="quickReplies" class="flex flex-wrap gap-2 pl-10">
                <button onclick="handleUserChoice('Quiero orientación sobre qué estudiar')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">
                    🔍 ¿Qué estudiar?
                </button>
                <button onclick="handleUserChoice('Soy estudiante de transferencia')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">
                    🔄 Transferencias
                </button>
                <button onclick="handleUserChoice('Información de programas 100% Online')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">
                    💻 Programas Online
                </button>
                <!-- NUEVA OPCIÓN: Sedes y Recintos -->
                <button onclick="handleUserChoice('Información sobre recintos y sedes')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">
                    📍 Sedes y Recintos
                </button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-white border-t border-gray-100">
            <div class="flex items-center gap-2 bg-gray-100 rounded-full p-1 pr-2">
                <input type="text" id="userInput" placeholder="Escribe tu mensaje aquí..." class="flex-1 bg-transparent border-none focus:ring-0 text-sm px-4 py-2 outline-none" onkeypress="handleEnter(event)">
                <button onclick="sendMessage()" class="w-8 h-8 bg-interGold text-white rounded-full flex items-center justify-center hover:bg-yellow-500 transition-colors">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
            <div class="text-center mt-2">
                <span class="text-[10px] text-gray-400">Impulsado por IA • Respuestas orientativas</span>
            </div>
        </div>
    </div>

    <script>
        const chatToggle = document.getElementById('chatToggle');
        const chatWidget = document.getElementById('chatWidget');
        const closeChat = document.getElementById('closeChat');
        const resetChat = document.getElementById('resetChat');
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const quickRepliesContainer = document.getElementById('quickReplies');

        let conversationState = 'initial';

        // Toggle Chat
        chatToggle.addEventListener('click', () => {
            chatWidget.classList.remove('scale-0');
            chatWidget.classList.add('scale-100');
        });

        closeChat.addEventListener('click', () => {
            chatWidget.classList.remove('scale-100');
            chatWidget.classList.add('scale-0');
        });

        // Evento para el botón de reinicio en el header
        resetChat.addEventListener('click', () => {
            appendMessage('user', 'Volver al menú principal');
            resetChatToMain();
        });

        // Función para volver al inicio
        function resetChatToMain() {
            conversationState = 'initial';
            appendMessage('bot', `¡Aquí estamos de vuelta en el menú principal! ¿En qué te puedo ayudar?`);
            
            const mainReplies = `
                <div class="flex flex-wrap gap-2 pl-10 mt-2 quick-options">
                    <button onclick="handleUserChoice('Quiero orientación sobre qué estudiar')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">🔍 ¿Qué estudiar?</button>
                    <button onclick="handleUserChoice('Soy estudiante de transferencia')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">🔄 Transferencias</button>
                    <button onclick="handleUserChoice('Información de programas 100% Online')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">💻 Programas Online</button>
                    <button onclick="handleUserChoice('Información sobre recintos y sedes')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">📍 Sedes y Recintos</button>
                    <button onclick="handleUserChoice('¿Por qué estudiar en La Inter?')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">🏛️ ¿Por qué La Inter?</button>
                </div>
            `;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = mainReplies;
            chatMessages.appendChild(tempDiv.firstElementChild);
            scrollToBottom();
            
            if(quickRepliesContainer) quickRepliesContainer.style.display = 'none';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function handleUserChoice(text) {
            if(quickRepliesContainer) quickRepliesContainer.style.display = 'none';
            appendMessage('user', text);
            processBotLogic(text);
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            
            if(quickRepliesContainer) quickRepliesContainer.style.display = 'none';
            userInput.value = '';
            appendMessage('user', text);
            processBotLogic(text);
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'flex justify-end gap-2' : 'flex gap-2';
            
            let innerHTML = '';
            if (sender === 'user') {
                innerHTML = `
                    <div class="bg-interGreen text-white p-3 rounded-2xl rounded-tr-none shadow-sm text-sm max-w-[85%]">
                        ${text}
                    </div>
                `;
            } else {
                innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-interGreen flex-shrink-0 flex items-center justify-center text-white text-xs">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="bg-white border border-gray-100 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm text-gray-700 max-w-[85%]">
                        ${text}
                    </div>
                `;
            }
            
            msgDiv.innerHTML = innerHTML;
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'flex gap-2';
            typingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-interGreen flex-shrink-0 flex items-center justify-center text-white text-xs">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bg-white border border-gray-100 p-3 rounded-2xl rounded-tl-none shadow-sm typing-indicator flex items-center gap-1">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Mock AI Logic based on Playbook & RAG Architecture
        function processBotLogic(userText) {
            showTypingIndicator();
            userInput.disabled = true;

            setTimeout(() => {
                removeTypingIndicator();

                // Interceptar solicitud de volver al menú vía texto (NLP Básico)
                const lowerText = userText.toLowerCase();
                if (lowerText.includes('menú') || lowerText.includes('menu') || lowerText.includes('inicio') || lowerText.includes('empezar')) {
                    resetChatToMain();
                    userInput.disabled = false;
                    userInput.focus();
                    return;
                }

                let botResponse = '';
                let nextReplies = '';

                // Simulated State Machine based on intent
                
                // NUEVO FLUJO: Institucional / Prestigio (Desde inter.edu)
                if (conversationState === 'initial' && (lowerText.includes('por qué') || lowerText.includes('prestigio') || lowerText.includes('acreditación') || lowerText.includes('acreditacion') || lowerText.includes('historia'))) {
                    botResponse = `¡Excelente pregunta! 🐯 En la Interamericana llevamos haciendo historia desde <b>1912</b>. Somos una institución con profundas raíces cristianas y valores firmes.<br><br>
                    Además, contamos con las más altas <b>acreditaciones académicas (como la MSCHE)</b>, lo que asegura que tu diploma tenga peso aquí y fuera de Puerto Rico. Todo nuestro ecosistema en <i>www.inter.edu</i> está diseñado para tu vida espiritual, deportiva y profesional.<br><br>
                    Sabiendo esto, ¿te gustaría explorar nuestros programas académicos o recintos?`;
                    conversationState = 'initial'; // Se mantiene en initial para explorar otras ramas
                    
                    nextReplies = `
                        <div class="flex flex-wrap gap-2 pl-10 mt-2 quick-options">
                            <button onclick="handleUserChoice('Quiero orientación sobre qué estudiar')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">🔍 Ver Programas</button>
                            <button onclick="handleUserChoice('Información sobre recintos y sedes')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">📍 Ver Recintos</button>
                        </div>
                    `;
                }
                else if (conversationState === 'initial' && userText.toLowerCase().includes('orientación')) {
                    botResponse = `¡Nítido! Me encanta ayudar a descubrir talentos. 🤩 <br><br>Para recomendarte el mejor programa, cuéntame un poco: <b>¿Qué cosas te apasionan, o en qué áreas te gustaría trabajar en un futuro?</b> (ej. tecnología, aviación, salud, leyes, negocios...)`;
                    conversationState = 'vocational_discovery';
                } 
                else if (conversationState === 'initial' && userText.toLowerCase().includes('online')) {
                    botResponse = `¡Excelente elección! La modalidad online es ideal si trabajas o tienes poco tiempo. Tenemos Bachilleratos y Maestrías 100% en línea.<br><br>¿En qué área de estudios estás buscando tu programa online?`;
                    conversationState = 'vocational_discovery';
                }
                // NUEVO FLUJO: Identificación de intención de sedes/recintos
                else if (conversationState === 'initial' && (userText.toLowerCase().includes('recinto') || userText.toLowerCase().includes('sede'))) {
                    botResponse = `¡Claro que sí! La Inter está por toda la isla. 🌴🏫 Contamos con 9 recintos principales y 3 escuelas especializadas.<br><br>
                    Tenemos el <b>Recinto Metro</b> (en San Juan, el más grande), <b>San Germán</b> (nuestro campus histórico fundado en 1912), y recintos en <b>Aguadilla, Arecibo, Barranquitas, Bayamón, Fajardo, Guayama y Ponce</b>.<br><br>
                    ¿Qué recinto te queda más cerquita o en cuál tienes en mente estudiar?`;
                    conversationState = 'campus_selected';
                    
                    nextReplies = `
                        <div class="flex flex-wrap gap-2 pl-10 mt-2 quick-options">
                            <button onclick="handleUserChoice('Me interesa el Recinto Metro')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">Metro (San Juan)</button>
                            <button onclick="handleUserChoice('Me interesa San Germán')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">San Germán</button>
                            <button onclick="handleUserChoice('Me interesa otro recinto de la isla')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">Otro recinto</button>
                            <button onclick="handleUserChoice('Volver al menú principal')" class="bg-gray-100 text-gray-600 border border-gray-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-gray-200 transition-colors">🏠 Menú</button>
                        </div>
                    `;
                }
                // FLUJO: Transición a captura de lead tras elegir recinto
                else if (conversationState === 'campus_selected') {
                    botResponse = `¡Tremenda elección! Cada recinto tiene su propio "flow" y una vida estudiantil brutal. 😎<br><br>
                    Para enviarte la lista exacta de bachilleratos y certificados que ofrecemos en el recinto que te interesa a través de nuestro portal SetuInter, <b>¿me podrías brindar tu nombre y un correo electrónico?</b>`;
                    conversationState = 'capturing_lead';
                    
                    nextReplies = `
                        <div class="flex flex-wrap gap-2 pl-10 mt-2 quick-options">
                            <button onclick="handleUserChoice('Volver al menú principal')" class="bg-gray-100 text-gray-600 border border-gray-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-gray-200 transition-colors">🏠 Cancelar y volver</button>
                        </div>
                    `;
                }
                else if (conversationState === 'vocational_discovery') {
                    // NUEVO: Manejo de escuelas especializadas (Aviación, Derecho, Optometría)
                    if (lowerText.includes('aviación') || lowerText.includes('aviacion') || lowerText.includes('aviones') || lowerText.includes('piloto')) {
                        botResponse = `¡A volar alto! ✈️ La Inter es súper reconocida por nuestra <b>Escuela de Aeronáutica</b> en el Recinto de Bayamón. Formamos a los mejores pilotos y gerentes de aviación del Caribe.<br><br>
                        Para conectarte con un oficial que te dé los detalles de admisión para Aviación en SetuInter, <b>¿me regalas tu nombre y un email?</b>`;
                        conversationState = 'capturing_lead';
                    }
                    else if (lowerText.includes('leyes') || lowerText.includes('abogado') || lowerText.includes('derecho')) {
                        botResponse = `¡Esa es una meta de respeto! ⚖️ Tenemos nuestra prestigiosa <b>Facultad de Derecho</b>, reconocida internacionalmente y con un currículo brutal para prepararte para la reválida.<br><br>
                        Para enviarte los requisitos de admisión a Derecho, <b>¿me dejas tu nombre y un correo electrónico?</b>`;
                        conversationState = 'capturing_lead';
                    }
                    else {
                        // Simulating AI RAG matching regular (SetuInter Programs)
                        botResponse = `¡Wow, eso suena brutal! Basado en lo que me dices, creo que en La Inter tenemos opciones perfectas para ti. Podrías destacarte en:<br><br>
                        • <b>Bachillerato en Sistemas de Información</b><br>
                        • <b>Bachillerato en Ciencias de Computadoras</b><br><br>
                        ¿Cuál de los dos te llama más la atención para darte los detalles?`;
                        conversationState = 'lead_capture_trigger';
                        
                        nextReplies = `
                            <div class="flex flex-wrap gap-2 pl-10 mt-2 quick-options">
                                <button onclick="handleUserChoice('Sistemas de Información')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">Sistemas</button>
                                <button onclick="handleUserChoice('Ciencias de Computadoras')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">Ciencias de Cómputos</button>
                                <button onclick="handleUserChoice('Volver al menú principal')" class="bg-gray-100 text-gray-600 border border-gray-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-gray-200 transition-colors">🏠 Menú</button>
                            </div>
                        `;
                    }
                }
                else if (conversationState === 'lead_capture_trigger') {
                    botResponse = `¡Tremenda elección! 🚀 Es una carrera con mucha demanda laboral hoy en día. <br><br>
                    Para poder enviarte el currículo (pensum) detallado de las clases, los costos y que un oficial de admisiones te ayude a ver los requisitos, <b>¿me podrías brindar tu nombre y un correo electrónico?</b>`;
                    conversationState = 'capturing_lead';
                    
                    nextReplies = `
                        <div class="flex flex-wrap gap-2 pl-10 mt-2 quick-options">
                            <button onclick="handleUserChoice('Volver al menú principal')" class="bg-gray-100 text-gray-600 border border-gray-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-gray-200 transition-colors">🏠 Cancelar y volver</button>
                        </div>
                    `;
                }
                else if (conversationState === 'capturing_lead') {
                    if (userText.includes('@')) {
                        botResponse = `¡Gracias, pana! 🐯 Ya guardé tu información de forma segura. <br><br>
                        En breve te enviaremos la información al correo. Mientras tanto, ¿te gustaría saber sobre las ayudas económicas y FAFSA para pagar tu matrícula?`;
                        conversationState = 'financial_aid';
                        nextReplies = `
                        <div class="flex flex-wrap gap-2 pl-10 mt-2 quick-options">
                            <button onclick="handleUserChoice('Sí, ¿cómo funcionan las ayudas?')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">Sí, hablar de ayudas</button>
                            <button onclick="handleUserChoice('Volver al menú principal')" class="bg-gray-100 text-gray-600 border border-gray-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-gray-200 transition-colors">🏠 Menú</button>
                        </div>
                        `;
                    } else {
                        botResponse = `¡Chévere! Pero me parece que faltó el correo electrónico (asegúrate de que tenga el @). ¿Me lo compartes de nuevo?`;
                    }
                }
                else if (conversationState === 'financial_aid') {
                    botResponse = `¡Claro! En la Inter te ayudamos a bregar con eso. El 90% de nuestros estudiantes recibe algún tipo de Asistencia Económica.<br><br>
                    Puedes usar la Beca Pell (FAFSA) y tenemos opciones institucionales. Un asesor financiero te contactará para guiarte paso a paso. ¡No dejes que los chavos te detengan!<br><br>
                    ¿Hay algo más en lo que te pueda orientar hoy?`;
                    conversationState = 'end';
                }
                else {
                    botResponse = `Entiendo. Como soy un asistente virtual en entrenamiento, a veces me pierdo un poco. 😅<br><br>¿Te gustaría que le deje tu contacto a un oficial de admisiones de SETU INTER para que te llame y te oriente personalmente?`;
                    nextReplies = `
                        <div class="flex flex-wrap gap-2 pl-10 mt-2 quick-options">
                            <button onclick="handleUserChoice('Sí, quiero que me llamen')" class="bg-interLight text-interGreen border border-interGreen px-3 py-1.5 rounded-full text-xs font-medium hover:bg-interGreen hover:text-white transition-colors">Sí, por favor</button>
                            <button onclick="handleUserChoice('Volver al menú principal')" class="bg-gray-100 text-gray-600 border border-gray-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-gray-200 transition-colors">🏠 Menú</button>
                        </div>
                    `;
                }

                appendMessage('bot', botResponse);
                
                if (nextReplies) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = nextReplies;
                    chatMessages.appendChild(tempDiv.firstElementChild);
                    scrollToBottom();
                }

                userInput.disabled = false;
                userInput.focus();

            }, 1200); // Simulate network latency
        }

        // Remove old quick replies when a new message is sent
        const observer = new MutationObserver((mutations) => {
            const buttons = document.querySelectorAll('.quick-options');
            if (buttons.length > 1) {
                for (let i = 0; i < buttons.length - 1; i++) {
                    buttons[i].style.display = 'none';
                }
            }
        });
        observer.observe(chatMessages, { childList: true });

        // Auto-open chat for demo purposes after 1 second
        setTimeout(() => {
            chatToggle.click();
        }, 1000);

    </script>
</body>
</html>
